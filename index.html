<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>스네이크 (최소 예제 / 화살표 키)</title>
<style>
  html, body { height:100%; margin:0; background:#0f1220; color:#e5e7eb; overflow:hidden; font-family:system-ui, "Noto Sans KR", Arial, sans-serif; }
  .wrap { height:100%; display:flex; align-items:center; justify-content:center; padding:12px; }
  .card { width:min(96vw, 560px); border:1px solid rgba(255,255,255,.1); border-radius:14px; background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015)); box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; font-size:14px; }
  .hud { color:#a8b1c7; display:flex; gap:10px; }
  .hud strong { color:#fff; }
  .canvas-wrap { padding:10px; border-top:1px solid rgba(255,255,255,.06); border-bottom:1px solid rgba(255,255,255,.06); }
  canvas {
    display:block; width:min(92vmin,520px); height:min(92vmin,520px); margin:0 auto;
    background: #111425;
    image-rendering: pixelated; border-radius:12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
  }
  footer { padding:10px 12px 14px; text-align:center; color:#a8b1c7; font-size:12px; }
  kbd{ background:#0e1324; border:1px solid rgba(255,255,255,.15); border-bottom-color:rgba(0,0,0,.5); padding:2px 6px; border-radius:6px; font-size:12px; color:#e2e8f0; }
  .debug { text-align:center; font-size:12px; color:#9ca3af; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header>
      <div>🐍 스네이크 (최소 예제)</div>
      <div class="hud">
        점수 <strong id="score">0</strong>
        · 최고점수 <strong id="best">0</strong>
        · 속도 <strong id="speed">1.0x</strong>
      </div>
    </header>
    <div class="canvas-wrap">
      <canvas id="game"></canvas>
    </div>
    <footer>
      이동: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> · 일시정지: <kbd>Space</kbd> · 재시작: <kbd>R</kbd>
      <div class="debug">마지막 키: <span id="lastKey">없음</span></div>
    </footer>
  </div>
</div>

<script>
(() => {
  // ---- 설정값 ----
  const GRID = 21;
  const BASE_SPEED = 8;
  const MAX_SPEED = 16;
  const SPEED_STEP = 0.25;
  const SPEEDUP_EVERY = 5;

  // ---- 상태 ----
  let snake, dir, nextDir, food, score, best, speed, last, acc, paused, over;
  let turnedThisTick = false;

  // ---- DOM ----
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha:false });
  const elScore = document.getElementById('score');
  const elBest  = document.getElementById('best');
  const elSpeed = document.getElementById('speed');
  const elLastKey = document.getElementById('lastKey');

  // ---- 캔버스 크기 ----
  let DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));
  let cell = 24;
  function resize(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));
    canvas.width  = Math.floor(w * DPR);
    canvas.height = Math.floor(h * DPR);
    cell = Math.floor(Math.min(canvas.width, canvas.height) / GRID);
    ctx.setTransform(1,0,0,1,0,0);
  }
  window.addEventListener('resize', resize);

  // ---- 유틸 ----
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const same = (a,b) => a.x === b.x && a.y === b.y;

  function placeFood(){
    while(true){
      const p = { x: randInt(0, GRID-1), y: randInt(0, GRID-1) };
      if (!snake.some(s => same(s, p))) { food = p; return; }
    }
  }

  function reset(){
    score = 0;
    speed = BASE_SPEED;
    elScore.textContent = "0";
    elSpeed.textContent = speed.toFixed(1) + "x";

    const cx = Math.floor(GRID/2), cy = Math.floor(GRID/2);
    snake = [
      {x:cx, y:cy},
      {x:cx-1, y:cy},
      {x:cx-2, y:cy}
    ];
    dir = {x:1, y:0};
    nextDir = {...dir};
    placeFood();

    paused = false;
    over = false;
    last = performance.now();
    acc = 0;
    turnedThisTick = false;
  }

  function setDir(nx, ny){
    if (turnedThisTick || over) return;
    if (nx === -dir.x && ny === -dir.y) return; // 역방향 금지
    nextDir = {x:nx, y:ny};
    turnedThisTick = true;
  }

  // ---- 키보드 입력 (전역, 포커스 불필요) ----
  // 일부 환경에서 스크롤/탭 전환을 막기 위해 preventDefault 사용
  window.addEventListener('keydown', (e) => {
    elLastKey.textContent = e.key + (e.code ? ` (${e.code})` : '');
    if (e.key === 'ArrowUp')        { e.preventDefault(); setDir(0, -1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setDir(0, 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); setDir(-1, 0); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); setDir(1, 0); }
    else if (e.code === 'Space')    { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R'){ e.preventDefault(); reset(); }
  }, {capture:true}); // capture:true 로 상위 단계에서 먼저 가로채기

  // ---- 게임 루프/로직 ----
  function togglePause(){
    if (over) return;
    paused = !paused;
    last = performance.now();
    acc = 0;
  }

  function step(){
    dir = {...nextDir};
    turnedThisTick = false;

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    // 벽/몸 충돌
    if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) return gameOver();
    for (let i=0;i<snake.length;i++){ if (snake[i].x === nx && snake[i].y === ny) return gameOver(); }

    snake.unshift({x:nx, y:ny});
    if (food && nx === food.x && ny === food.y){
      score++; elScore.textContent = String(score);
      if (score % SPEEDUP_EVERY === 0){ speed = Math.min(MAX_SPEED, speed + SPEED_STEP); elSpeed.textContent = speed.toFixed(1) + "x"; }
      if (score > (best||0)){ best = score; elBest.textContent = String(best); try{ localStorage.setItem('snake_best', String(best)); }catch{} }
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver(){ over = true; paused = true; }

  function update(dt){
    if (paused) return;
    acc += dt;
    const stepMs = 1000 / speed;
    while (acc >= stepMs){
      step();
      acc -= stepMs;
      if (over) break;
    }
  }

  // ---- 렌더링 ----
  function drawCell(px, py, fill, inset=2){
    const x = px*cell + inset, y = py*cell + inset, size = cell - inset*2, r = Math.min(6, size/2);
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+size, y, x+size, y+size, r);
    ctx.arcTo(x+size, y+size, x, y+size, r);
    ctx.arcTo(x, y+size, x, y, r);
    ctx.arcTo(x, y, x+size, y, r);
    ctx.closePath(); ctx.fill();
  }
  function draw(){
    ctx.fillStyle = "#111425";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 음식
    if (food){
      const cx = food.x * cell + cell/2, cy = food.y * cell + cell/2, r = Math.floor(cell*0.33);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fillStyle = "#f97316"; ctx.fill();
    }
    // 뱀
    if (snake && snake.length){
      for (let i=snake.length-1;i>=1;i--) drawCell(snake[i].x, snake[i].y, "#22c55e", 3);
      drawCell(snake[0].x, snake[0].y, "#16a34a", 2);
    }

    if (paused && !over){
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillRect(0,0,GRID*cell,GRID*cell);
      ctx.fillStyle = "white"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.font = `700 ${Math.floor(cell*0.9)}px system-ui`; ctx.fillText("일시정지", GRID*cell/2, GRID*cell/2);
    }
    if (over){
      ctx.fillStyle = "rgba(0,0,0,.55)";
      ctx.fillRect(0,0,GRID*cell,GRID*cell);
      ctx.fillStyle = "white"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.font = `700 ${Math.floor(cell*0.9)}px system-ui`; ctx.fillText("게임 오버", GRID*cell/2, GRID*cell/2 - cell*0.5);
      ctx.font = `400 ${Math.floor(cell*0.48)}px system-ui`; ctx.fillText("R: 재시작", GRID*cell/2, GRID*cell/2 + cell*0.3);
    }
  }

  function loop(now){
    const dt = now - last; last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  // ---- 시작 ----
  try { best = Number(localStorage.getItem('snake_best') || 0); elBest.textContent = String(best); } catch {}
  resize(); reset();
  // window에 포커스 시도 (일부 브라우저에서 필요)
  try { window.focus(); } catch {}
  requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
